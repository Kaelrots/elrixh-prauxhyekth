l_korean:

 ELX_FLAVOR_TEXT: "엘리시움 신성제국 연방은 세계 최초로 농업 혁명과 산업 혁명을 일으킨 세계 제일의 국가였습니다. 그래왔었고, 그래야 할 것입니다. 그러나, 제2차 대전이로 인해 전세계가 붕괴하였습니다. 그나마 남은 제도권 지역을 이용하여 드넓은 대지를 점령하고, 대양을 향해 나아갈 수 있을까요."


 GENERIC_FLAVOR_TEXT: "제2차 대전이 이후의 세계는 생존을 위한 혈투를 벌이는 시대입니다. 이 시대는 어떤 새로운 도전들로 가득 차 있을까요?"
 REV_GENERIC_FLAVOR_TEXT: "소위 체계적인 정부의 방침에 불만족한 혁명 세력은 직접 무기를 들고 정부를 타도하기로 했습니다. 과연 이들은 권력을 쟁취하는 데 성공할까요? 아니면 앞서 기억의 저편으로 잊혀 버린 수많은 혁명처럼 무참히 짓밟히고 말까요?"
 DECENTRALIZED_FLAVOR_TEXT: "이 국가는 더 잘 조직된 국가들에 휘둘리면서도 자주성을 지키기 위해 애쓰고 있습니다. 이 나라는 새로운 한 세기를 맞이하게 될까요, 아니면 역사서만이 그 이름을 기억하게 될까요?"

#Decentralized
 IMS_FLAVOR_TEXT: "$DECENTRALIZED_FLAVOR_TEXT$"
 VBA_FLAVOR_TEXT: "$DECENTRALIZED_FLAVOR_TEXT$"
 GRN_FLAVOR_TEXT: "$DECENTRALIZED_FLAVOR_TEXT$"
