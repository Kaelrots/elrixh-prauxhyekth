name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      # ---- 여기서부터 추가 ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mirror_assets.py
        run: python mirror_assets.py
      # ---- 여기까지 추가 ----
      - name: Read approved ELP transition configuration
        id: elp-transition
        run: node scripts/elp-legacy-transition.mjs --gate config/elp-legacy-transition.json
      - name: Check out approved ELP output
        if: steps.elp-transition.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Kaelrots/elrixh-prauxhyekth-site
          ref: ${{ steps.elp-transition.outputs.target_commit }}
          path: .elp-target-site
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.elp-site.json
            /site/
      - name: Preserve old pages and add verified ELP document redirects
        if: steps.elp-transition.outputs.enabled == 'true'
        run: node scripts/elp-legacy-transition.mjs --apply config/elp-legacy-transition.json public .elp-target-site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4